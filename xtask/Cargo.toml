[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
sha2.workspace = true
# The update manifest (ADR-0125): its format and verification come from ps-update; minisign signs it.
ps-update.workspace = true
minisign = "0.10"
minisign-verify = "0.3"
# The layering check parses sources (imports, `#[cfg(test)]` items) and scans their tokens (ADR-0062).
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
