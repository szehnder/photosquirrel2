[package]
name = "ps-fixtures"
description = "Deterministic synthetic ground-truth corpus generator (ADR-0025)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `scratch`: file writes, renames and removals on temporary test corpora. Enabled only from `[dev-dependencies]`
# (ps-scan's tests), never in a shipped binary; `cargo xtask layering` rejects `scratch::` outside tests (ADR-0101).
scratch = []

[dependencies]
ps-model.workspace = true
image = { workspace = true, features = ["jpeg", "gif"] }
png.workspace = true
tiff.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
moxcms.workspace = true
thiserror.workspace = true

[dev-dependencies]
ps-media.workspace = true
nom-exif.workspace = true
tempfile.workspace = true

[lints]
workspace = true
