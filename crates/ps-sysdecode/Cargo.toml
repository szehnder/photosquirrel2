[package]
name = "ps-sysdecode"
description = "HEIC/HEIF through the operating system's decoder (ImageIO, WIC, the system libheif), detection by self-test and install guidance (ADR-0089)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ps-model.workspace = true
# `test-support` for the debug-only `PHOTOSQUIRREL_HEIF_DECODER=fake` registry (ADR-0089).
ps-media = { workspace = true, features = ["test-support"] }
log.workspace = true

# The system libheif, loaded at run time (no link-time dependency; ADR-0089).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libloading.workspace = true

# WIC (HEIF Image Extensions), Media Foundation (HEVC decoders), RtlGetVersion.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
ps-fixtures.workspace = true
ps-hash.workspace = true

[lints]
workspace = true
