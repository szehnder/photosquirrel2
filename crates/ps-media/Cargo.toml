[package]
name = "ps-media"
description = "Format sniffing, metadata (EXIF, QuickTime), decoding, thumbnails and the photo classifier (ADR-0010, 0015, 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# HEIC/HEIF/AVIF decoding via libheif (ADR-0017). Off by default so the default build needs no system library.
heic = ["dep:libheif-rs"]
# The machine's time-zone rules (`date::os::OsZone`, ADR-0070). Enabled only by the I/O crates, so core builds
# and core tests never depend on the test machine's zone.
os-zone = ["dep:chrono", "dep:log"]

[dependencies]
ps-model.workspace = true
image.workspace = true
zune-jpeg.workspace = true
jpeg-decoder.workspace = true
mozjpeg.workspace = true
mozjpeg-sys.workspace = true
fast_image_resize.workspace = true
nom-exif.workspace = true
imagesize.workspace = true
rawler.workspace = true
libheif-rs = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
log = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
ps-fixtures.workspace = true
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "analyze"
harness = false

[lints]
workspace = true
