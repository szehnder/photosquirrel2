[package]
name = "ps-media"
description = "Format sniffing, metadata (EXIF, QuickTime), decoding, thumbnails and the photo classifier (ADR-0010, 0015, 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# rav1d's assembly for AVIF decoding (ADR-0090): needs nasm on x86_64. Enabled by default in the programs
# (`photosquirrel`, `photosquirrel-cli`); `--no-default-features` builds without it at slower AVIF speed.
avif-asm = ["rav1d/asm"]
# `decoders::fake::FakeHeif`, a deterministic HEIC test decoder (ADR-0089), for other crates' tests.
test-support = []
# The machine's time-zone rules (`date::os::OsZone`, ADR-0070). Enabled only by the I/O crates, so core builds
# and core tests never depend on the test machine's zone.
os-zone = ["dep:chrono", "dep:log"]

[dependencies]
ps-model.workspace = true
image.workspace = true
tiff.workspace = true
zune-jpeg.workspace = true
jpeg-decoder.workspace = true
mozjpeg.workspace = true
mozjpeg-sys.workspace = true
fast_image_resize.workspace = true
nom-exif.workspace = true
imagesize.workspace = true
rawler.workspace = true
rav1d.workspace = true
libc.workspace = true
chrono = { workspace = true, optional = true }
log = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
ps-media = { path = ".", features = ["test-support"] }
ps-fixtures.workspace = true
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "analyze"
harness = false

[lints]
workspace = true
