[package]
name = "ui-workspace"
description = "Application shell and panels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
ui-theme.workspace = true
ui-gallery.workspace = true
ps-service.workspace = true
ps-model.workspace = true
ps-media.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
anyhow.workspace = true
directories.workspace = true

[dev-dependencies]
# Tests seed and inspect catalogs directly; the code itself goes through ps-service (ADR-0027).
ps-catalog.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rusqlite.workspace = true
ps-fixtures.workspace = true
image.workspace = true
# `FakeHeif`, the deterministic HEIC test decoder (ADR-0089).
ps-media = { workspace = true, features = ["test-support"] }

# The frame-cost check reads the rendering thread's CPU clock (scan_dashboard.rs).
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["time"] }

[lints]
workspace = true
