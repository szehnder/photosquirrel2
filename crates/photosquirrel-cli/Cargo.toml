[package]
name = "photosquirrel-cli"
description = "Headless PhotoSquirrel CLI (ADR-0027)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "photosquirrel-cli"
path = "src/main.rs"

[features]
# HEIC/HEIF decoding via the system libheif (ADR-0017, ADR-0059).
heic = ["ps-media/heic"]

[dependencies]
ps-fixtures.workspace = true
ps-service.workspace = true
ps-catalog.workspace = true
ps-model.workspace = true
ps-media.workspace = true
ps-export.workspace = true
ps-llm.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
tempfile.workspace = true
blake3.workspace = true
insta.workspace = true
ps-llm = { workspace = true, features = ["testing"] }

[lints]
workspace = true
