[package]
name = "photosquirrel-cli"
description = "Headless PhotoSquirrel CLI (ADR-0027)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "photosquirrel-cli"
path = "src/main.rs"

[features]
# rav1d's assembly for AVIF (ADR-0090): needs nasm on x86_64. Without nasm: `--no-default-features` (slower
# AVIF decoding, identical output). Packaging refuses a build without it. HEIC is decoded by the operating
# system's decoder, detected at run time (ADR-0089): no build option.
default = ["avif-asm"]
avif-asm = ["ps-media/avif-asm"]

[dependencies]
ps-fixtures.workspace = true
ps-service.workspace = true
ps-catalog.workspace = true
ps-model.workspace = true
ps-media.workspace = true
ps-export.workspace = true
ps-llm.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Tests turn catalog rows into rows of an older version (capture-dates refresh).
rusqlite.workspace = true
blake3.workspace = true
insta.workspace = true
ps-llm = { workspace = true, features = ["testing"] }

[lints]
workspace = true
