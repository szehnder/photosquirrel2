version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ps-model.workspace = true
# Date parsers and the OS zone for undated files (ADR-0069, ADR-0070).
ps-media = { workspace = true, features = ["os-zone"] }
ps-catalog.workspace = true
ps-hash.workspace = true
blake3.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
ps-fixtures.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
