[package]
name = "ps-scan"
description = "Resumable, incremental, threaded scan pipeline (ADR-0007, 0008, 0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ps-model.workspace = true
# The run's local zone for instants (ADR-0070).
ps-media = { workspace = true, features = ["os-zone"] }
ps-hash.workspace = true
ps-catalog.workspace = true
ps-dedup.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
# `statfs`: whether the filesystem keeps file ids (ADR-0112).
rustix.workspace = true

[dev-dependencies]
# `frame::set_frame_identity_enabled`, the frame-identity test hook (ADR-0105).
ps-model = { workspace = true, features = ["test-hooks"] }
# `scratch`: the tests arrange temp corpora through `ps_fixtures::scratch` (ADR-0101).
ps-fixtures = { workspace = true, features = ["scratch"] }
# `FakeHeif`, the deterministic HEIC test decoder (ADR-0089).
ps-media = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
