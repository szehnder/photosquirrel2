name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (full CI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.14.1
      - name: cargo xtask ci
        run: cargo xtask ci

  perf:
    name: Performance budgets (relative to main)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # Pull requests compare with the newest baseline saved by a main run (ADR-0026). Runners differ from the
      # reference machine, so only relative regressions are checked, never the absolute budgets.
      - name: Restore the main baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.sha }}
          restore-keys: perf-baseline-
      - name: Check budgets (relative)
        if: github.event_name == 'pull_request'
        run: cargo xtask bench --check --ci
      - name: Record the baseline
        if: github.event_name == 'push'
        run: cargo xtask bench --ci --update-baseline
      - name: Save the baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.sha }}

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # Engine crates are platform-sensitive (paths, file ids, fsync, renames); UI tests run on Linux.
      - run: cargo test -p ps-model -p ps-media -p ps-hash -p ps-dedup -p ps-fixtures -p ps-catalog -p ps-scan -p ps-export -p ps-llm -p ps-service
