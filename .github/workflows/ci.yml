name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no checkout keeps it in .git/config; actions pinned to commits.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (full CI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System dependencies for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.14.1
      - name: Cargo.lock matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo xtask ci
        run: cargo xtask ci

  bench-regressions:
    name: Performance budgets (relative to the parent commit)
    needs: linux
    runs-on: ubuntu-24.04
    env:
      # Base and head share one target dir, so the base build reuses the compiled dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System dependencies for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ADR-0026: runners differ from the reference machine (whose baseline is the committed perf-baseline.json)
      # and from each other, so CI measures the base commit (the PR base, or the previous main) on this same
      # runner first, then checks the head for relative regressions (>15%) only, without app (window) budgets.
      # The base is measured best-of-3, the same policy the head gets for a suspected regression, so a noisy-high
      # base cannot hide one; budgets with `ci_runs` (control latency) are measured that often and compared by
      # their medians instead (ADR-0078). A base that produces no baseline file fails the job: comparing with nothing is not
      # a pass. Budgets the base has no value for (new in the head) are listed as warnings.
      - name: Measure the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning title=bench baseline::no base commit; the check below only proves every budget still measures"
            echo '{"values":{}}' > perf-baseline-ci.json
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          rm -f perf-baseline.json
          # A base older than --best-of measures once (warned): only the first push with it.
          if cargo xtask bench --help | grep -- --best-of >/dev/null; then best="--best-of 3"; else
            best=""; echo "::warning title=bench baseline::the base has no --best-of; measured once"; fi
          cargo xtask bench --ci --update-baseline $best
          test -s perf-baseline.json || { echo "::error title=bench baseline::the base wrote no perf-baseline.json"; exit 1; }
          jq -e '.values | length > 0' perf-baseline.json >/dev/null \
            || { echo "::error title=bench baseline::the base measured no budget"; exit 1; }
          cp perf-baseline.json "$GITHUB_WORKSPACE/perf-baseline-ci.json"
          # The base checkout is newer on disk than the head's sources, and cargo fingerprints path crates by
          # mtime: touch every tracked file of the head (sources, manifests and include_str!/include_bytes!
          # inputs such as migrations/*.sql) so every workspace crate and xtask is rebuilt from the head.
          cd "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 touch
      - name: Check the head against the base (relative)
        run: cargo xtask bench --check --ci --baseline perf-baseline-ci.json

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked
      # Platform-only code (cfg'd for macOS or Windows) gets the same lint bar as Linux.
      - run: cargo clippy --locked -p ps-model -p ps-media -p ps-hash -p ps-dedup -p ps-fixtures -p ps-catalog -p ps-scan -p ps-export -p ps-llm -p ps-service -p photosquirrel-cli -p xtask -- -D warnings
      # Engine crates are platform-sensitive (paths, file ids, fsync, renames); UI tests run on Linux.
      # The 1M-row catalog tests run at a tenth of the scale here: these runners take about an hour per test at
      # full scale, which Linux CI and `cargo xtask bench` cover.
      - run: cargo test --no-fail-fast -p ps-model -p ps-media -p ps-hash -p ps-dedup -p ps-fixtures -p ps-catalog -p ps-scan -p ps-export -p ps-llm -p ps-service
        env:
          PHOTOSQUIRREL_TEST_SCALE: reduced
      # The engine crates' wall-clock budget tests (`ignore = "timing"`, ADR-0075 and ADR-0076), alone and one at a
      # time after the main tests. Same packages as above, so cargo resolves the same features and rebuilds nothing.
      - name: Timing pass (engine crates)
        run: cargo test --no-fail-fast -p ps-model -p ps-media -p ps-hash -p ps-dedup -p ps-fixtures -p ps-catalog -p ps-scan -p ps-export -p ps-llm -p ps-service --test control -- --ignored --exact --test-threads=1 scenario_scan_control_cancel_within_250_ms scenario_scan_control_pause_within_250_ms
        env:
          PHOTOSQUIRREL_TEST_SCALE: reduced
