name: Release

# Installers for macOS, Windows and Linux (ADR-0030). Pushing a tag `v<workspace version>` builds every platform and
# publishes a GitHub Release. Running the workflow by hand (`gh workflow run release.yml`) is a dry run: it builds the
# same packages, checks the full set and its checksums and uploads them with the release notes as workflow
# artifacts, without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep in step with packaging/linux/Dockerfile.
  PACKAGER_VERSION: "0.11.8"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside packaging/linux/Dockerfile (Ubuntu 22.04) so the packages run on glibc 2.35+.
          - name: linux
            os: ubuntu-24.04
            args: --docker
          # One universal (arm64 + x86_64) build.
          - name: macos
            os: macos-15
            args: --universal
          - name: windows
            os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        if: matrix.name != 'linux'
        with:
          key: dist
      - name: Install cargo-packager and cargo-about
        if: matrix.name != 'linux'
        run: |
          cargo install cargo-packager --version ${{ env.PACKAGER_VERSION }} --locked
          cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --features cli --locked
      - name: Package
        shell: bash
        run: |
          args="${{ matrix.args }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args="$args --tag $GITHUB_REF_NAME"; fi
          cargo xtask package $args
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: target/packages/*
          if-no-files-found: error

  release:
    name: Check and publish the release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true
      - name: Check the packages and their checksums
        working-directory: packages
        run: |
          ls -l
          count=$(ls PhotoSquirrel-* | grep -vc '\.sha256$')
          sums=$(ls PhotoSquirrel-*.sha256 | wc -l)
          if [ "$count" -ne 6 ] || [ "$sums" -ne 6 ]; then
            echo "::error::expected 6 packages and 6 .sha256 files, found $count and $sums"; exit 1
          fi
          sha256sum -c PhotoSquirrel-*.sha256
      - name: Release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sed "s/{{version}}/$version/g" packaging/release-notes.md > notes.md
          # Platforms built without libheif (ADR-0059).
          if ls packages/heic-*.txt >/dev/null 2>&1; then
            printf '\n### HEIC photos\n\n' >> notes.md
            cat packages/heic-*.txt >> notes.md
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" packages/PhotoSquirrel-* $prerelease \
            --title "PhotoSquirrel $version" --notes-file notes.md
