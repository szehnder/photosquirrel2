name: Release

# Installers for macOS, Windows and Linux (ADR-0030). Pushing a tag `v<workspace version>` builds every platform,
# signs and notarizes the macOS app and DMG (ADR-0128) and publishes a GitHub Release. Running the workflow by hand (`gh workflow run release.yml`, from any ref, a tag
# included) is a dry run: it builds the same packages, checks the full set, its checksums and the LGPL sources and
# uploads them with the release notes as workflow artifacts, without creating a release. A dry run signs the macOS
# packages only when `sign_macos` is ticked and the `macos_signing` environment admits the ref (its deployment rules).
#
# The build compiles hundreds of third-party crates, so the token is read-only everywhere except the step that
# publishes, no checkout keeps it in .git/config, and every action is pinned to a commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: "Sign and notarize the macOS packages (needs the macos_signing environment's approval for this ref)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with packaging/linux/Dockerfile.
  PACKAGER_VERSION: "0.11.8"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside packaging/linux/Dockerfile (Ubuntu 22.04) so the packages run on glibc 2.35+.
          - name: linux
            os: ubuntu-24.04
            args: --docker
          # One universal (arm64 + x86_64) build.
          - name: macos
            os: macos-15
            args: --universal
          - name: windows
            os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The branch of rust-toolchain.toml's version, pinned to its commit.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.name != 'linux'
        with:
          key: dist
      # nasm builds rav1d's x86_64 assembly (AVIF, ADR-0090): the x86_64 half of the universal macOS build and
      # Windows. The Linux packages build inside the packaging image, which has it.
      - name: nasm (macOS)
        if: matrix.name == 'macos'
        run: brew install nasm
      - name: nasm (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
      - name: Install cargo-packager and cargo-about
        if: matrix.name != 'linux'
        run: |
          cargo install cargo-packager --version ${{ env.PACKAGER_VERSION }} --locked
          cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --features cli --locked
      - name: Package
        shell: bash
        run: |
          args="${{ matrix.args }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args="$args --tag $GITHUB_REF_NAME"; fi
          cargo xtask package $args
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: target/packages/*
          if-no-files-found: error
      # The unsigned app for the signing job (ADR-0128), taken from the DMG: cargo-packager deletes its intermediate
      # .app once the DMG is built, and this is exactly the bundle users get. A ditto zip keeps symlinks and attributes.
      - name: Unsigned app (macOS)
        if: matrix.name == 'macos'
        run: |
          dmgs=$(ls target/packages/PhotoSquirrel-*-macos-universal.dmg)
          if [ "$(printf '%s\n' "$dmgs" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one macOS DMG in target/packages, found: $dmgs"; exit 1
          fi
          mnt=$(mktemp -d)
          # The DMG carries the licence agreement (`licenseFile`), which `hdiutil attach` pages and asks to accept;
          # answer it on stdin, as xtask's licence check does.
          printf 'Y\n' | PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmgs" >/dev/null
          trap 'hdiutil detach "$mnt" || true' EXIT
          if [ ! -d "$mnt/PhotoSquirrel.app" ]; then
            echo "::error::the DMG has no PhotoSquirrel.app"; ls -la "$mnt"; exit 1
          fi
          ditto -c -k --keepParent "$mnt/PhotoSquirrel.app" target/macos-app-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'macos'
        with:
          name: macos-app-unsigned
          path: target/macos-app-unsigned.zip
          if-no-files-found: error

  # Signs, notarizes and staples the macOS app and DMG (ADR-0128). The only job that can read the signing secrets:
  # it runs in the protected macos_signing environment, compiles nothing (Apple's tools and one script from this
  # repository) and deletes its keychain and key files on every outcome.
  sign-macos:
    name: Sign and notarize (macOS)
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_macos)
    runs-on: macos-15
    environment: macos_signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app-unsigned
          path: unsigned
      - name: Sign, notarize and staple
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash packaging/macos/sign.sh unsigned/macos-app-unsigned.zip signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed
          path: signed/*
          if-no-files-found: error

  # Checks the signed app and DMG (Developer ID of the APPLE_TEAM_ID team, hardened runtime, timestamp, Gatekeeper,
  # stapled tickets), runs the signed programs and rebuilds the macOS archive from the signed app. No secrets.
  verify-macos:
    name: Verify the signed macOS packages
    needs: [package, sign-macos]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app-unsigned
          path: unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed
          path: signed
      - name: Verify and rebuild the archive
        run: >-
          cargo xtask macos-signed --signed signed --unsigned-app unsigned/macos-app-unsigned.zip
          --team-id "${{ vars.APPLE_TEAM_ID }}" --out signed-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos-packages
          path: signed-packages/*
          if-no-files-found: error

  # The AppImage runtime's source archives (ADR-0073, ADR-0077), fetched and checked by xtask in a read-only job so
  # the job that can publish compiles nothing.
  runtime-sources:
    name: AppImage runtime sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - name: Fetch and check the pinned sources
        run: cargo xtask runtime-sources --out runtime-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-source
          path: runtime-source/*
          if-no-files-found: error

  release:
    name: Check and publish the release
    needs: [package, runtime-sources, verify-macos]
    # verify-macos is skipped on a dry run that does not sign; a tag always needs it (the step below fails without
    # the signed packages).
    if: >-
      always() && needs.package.result == 'success' && needs.runtime-sources.result == 'success' &&
      (needs.verify-macos.result == 'success' || (needs.verify-macos.result == 'skipped' && github.event_name != 'push'))
    runs-on: ubuntu-24.04
    # The only write permission: creating the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-source
          path: packages/runtime-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify-macos.result == 'success'
        with:
          name: signed-macos-packages
          path: signed-macos
      # A release takes its macOS packages from verify-macos only (ADR-0128).
      - name: Use the signed macOS packages
        run: |
          if [ -d signed-macos ]; then
            rm packages/PhotoSquirrel-*-macos-*
            mv signed-macos/* packages/
            echo "macOS packages: signed, notarized and stapled." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::a release needs the signed macOS packages (verify-macos)"; exit 1
            fi
            echo "::warning::macOS packages are NOT signed (dry run without sign_macos)"
            echo "**macOS packages are NOT signed** (dry run without sign_macos)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the packages and their checksums
        working-directory: packages
        run: |
          ls -l
          count=$(ls PhotoSquirrel-* | grep -vc '\.sha256$')
          sums=$(ls PhotoSquirrel-*.sha256 | wc -l)
          # Linux AppImage, .deb, .tar.gz; macOS .dmg, .tar.gz; Windows setup .exe, .zip.
          if [ "$count" -ne 7 ] || [ "$sums" -ne 7 ]; then
            echo "::error::expected 7 packages and 7 .sha256 files, found $count and $sums"; exit 1
          fi
          sha256sum -c PhotoSquirrel-*.sha256
      # LGPL-2.1 components are linked statically; the release carries the source of each one at the version in
      # Cargo.lock (ADR-0060). The download is checked against Cargo.lock's checksum. Every platform lists its own
      # LGPL crates (lgpl-sources-<os>.txt); the lists are merged and must agree.
      - name: Attach the source of the LGPL components
        run: |
          bash packaging/merge-lgpl-sources.sh packages linux macos windows
          while read -r name ver; do
            [ -n "$name" ] || continue
            sum=$(awk -v n="name = \"$name\"" -v v="version = \"$ver\"" \
              '$0 == n { getline; if ($0 == v) { getline; getline; gsub(/"/, "", $3); print $3 } }' Cargo.lock)
            [ -n "$sum" ] || { echo "::error::$name $ver is not in Cargo.lock"; exit 1; }
            curl -fsSL --retry 3 -o "packages/$name-$ver.crate" "https://crates.io/api/v1/crates/$name/$ver/download"
            (cd packages && echo "$sum  $name-$ver.crate" | sha256sum -c)
          done < packages/lgpl-sources.txt
          expected=$(grep -c . packages/lgpl-sources.txt || true)
          found=$(ls packages/*.crate 2>/dev/null | wc -l)
          if [ "$expected" -lt 1 ] || [ "$found" -ne "$expected" ]; then
            echo "::error::expected the source of $expected LGPL components, found $found"; exit 1
          fi
      # The AppImage starts with the AppImage runtime, which links libfuse (LGPL-2.1) statically. The release
      # carries the source the pinned runtime was built from and the source of the code linked with libfuse
      # (the runtime itself and squashfuse), for relinking. The runtime-sources job made them; every file is
      # checked again here against the pin (ADR-0073, ADR-0077).
      - name: Attach the source of the AppImage runtime
        run: |
          python3 - > runtime-sources.txt <<'EOF'
          import tomllib
          with open("packaging/linux/appimage-runtime.toml", "rb") as f:
              pin = tomllib.load(f)
          for s in pin["source"]:
              print(s["file"], s["sha256"])
          EOF
          test -s runtime-sources.txt || { echo "::error::the AppImage runtime pin lists no [[source]]"; exit 1; }
          while read -r file sum; do
            (cd packages/runtime-source && echo "$sum  $file" | sha256sum -c)
          done < runtime-sources.txt
          if [ "$(ls packages/runtime-source | wc -l)" -ne "$(wc -l < runtime-sources.txt)" ]; then
            echo "::error::expected $(wc -l < runtime-sources.txt) AppImage runtime source files"; exit 1
          fi
      - name: Release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lgpl=$(awk '{ printf "%s%s %s", (NR > 1 ? ", " : ""), $1, $2 }' packages/lgpl-sources.txt)
          runtime_sources=$(ls packages/runtime-source | awk '{ printf "%s`%s`", (NR > 1 ? ", " : ""), $0 }')
          sed -e "s/{{version}}/$version/g" -e "s/{{lgpl}}/$lgpl/g" -e "s/{{runtime_sources}}/$runtime_sources/g" \
            packaging/release-notes.md > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            notes.md
            packages/*.crate
            packages/lgpl-sources.txt
            packages/lgpl-sources-*.txt
            packages/runtime-source/*
          if-no-files-found: error
      - name: Create the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" packages/PhotoSquirrel-* packages/*.crate packages/runtime-source/* \
            $prerelease \
            --title "PhotoSquirrel $version" --notes-file notes.md
