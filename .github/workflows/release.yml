name: Release

# Installers for macOS, Windows and Linux (ADR-0030). Pushing a tag `v<workspace version>` builds every platform and
# publishes a GitHub Release; running the workflow by hand builds the same packages as workflow artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep in step with packaging/linux/Dockerfile.
  PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside packaging/linux/Dockerfile (Ubuntu 22.04) so the packages run on glibc 2.35+.
          - name: linux
            os: ubuntu-24.04
            args: --docker
          # One universal (arm64 + x86_64) build.
          - name: macos
            os: macos-15
            args: --universal
          - name: windows
            os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        if: matrix.name != 'linux'
        with:
          key: dist
      - name: Install cargo-packager
        if: matrix.name != 'linux'
        run: cargo install cargo-packager --version ${{ env.PACKAGER_VERSION }} --locked
      - name: Package
        shell: bash
        run: |
          args="${{ matrix.args }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args="$args --tag $GITHUB_REF_NAME"; fi
          cargo xtask package $args
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: target/packages/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/{{version}}/$version/g" packaging/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" packages/* --title "PhotoSquirrel $version" --notes-file notes.md
