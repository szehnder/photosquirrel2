[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/szehnder/photosquirrel2"

[workspace.dependencies]
# Internal crates (layering in docs/adr/0004)
ps-model = { path = "crates/ps-model" }
ps-media = { path = "crates/ps-media" }
ps-sysdecode = { path = "crates/ps-sysdecode" }
ps-hash = { path = "crates/ps-hash" }
ps-dedup = { path = "crates/ps-dedup" }
ps-fixtures = { path = "crates/ps-fixtures" }
ps-catalog = { path = "crates/ps-catalog" }
ps-scan = { path = "crates/ps-scan" }
ps-llm = { path = "crates/ps-llm" }
ps-export = { path = "crates/ps-export" }
ps-service = { path = "crates/ps-service" }
ui-theme = { path = "crates/ui-theme" }
ui-gallery = { path = "crates/ui-gallery" }
ui-workspace = { path = "crates/ui-workspace" }

# UI
gpui-kit = { version = "0.7.3", default-features = false, features = ["component", "assets"] }

# Concurrency
crossbeam-channel = "0.5"
rayon = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
futures = "0.3"

# Media
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
# Strip/tile TIFF decoding (ADR-0085): the version `image` already uses, with its default codecs.
tiff = "0.11"
zune-jpeg = "0.5"
jpeg-decoder = { version = "0.3", default-features = false }
# libjpeg-turbo-derived DCT-scaled decodes, plain C built by `cc` (no nasm, no cmake; ADR-0054).
mozjpeg = { version = "0.10", default-features = false }
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding", "parallel"] }
fast_image_resize = "6"
nom-exif = "3.8"
imagesize = "0.14"
png = "0.18"
rawler = "0.8"
# AVIF stills: the Rust port of dav1d, BSD-2-Clause (ADR-0090). Assembly (`asm`, needs nasm on x86_64) comes
# through ps-media's `avif-asm` feature.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = "0.2"
# The system libheif, loaded at run time on Linux (ADR-0089); already in the lock through gpui.
libloading = "0.8"

# Hashing
blake3 = "1"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
smallvec = "1"
rustc-hash = "2"
# The OS time-zone rules for ps-media's `os-zone` feature (ADR-0070); already in the build through nom-exif.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
toml = "0.9"
quick-xml = "0.41"
# No-replace rename (renameat2 RENAME_NOREPLACE / renameatx_np RENAME_EXCL) and statvfs for ps-export.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# `MoveFileExW` without `MOVEFILE_REPLACE_EXISTING` for the quarantine move on Windows (ADR-0062).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
keyring = { version = "3", features = ["linux-native-sync-persistent", "apple-native", "windows-native", "crypto-rust"] }

# Network (LLM providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
url = "2"

# CLI / dev
clap = { version = "4", features = ["derive", "env"] }
# Cooperative Ctrl-C in the CLI (headless-cli design: no hand-written signal handler under `unsafe_code = "deny"`).
ctrlc = "3.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
tempfile = "3"
insta = { version = "1", features = ["json", "yaml"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
rand = "0.9"
rand_chacha = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
# GPUI and image decoding are very slow unoptimized; optimize deps, keep our crates debuggable.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
# Hashing and pixel loops are hot; keep them fast in tests too.
[profile.dev.package.ps-hash]
opt-level = 3
[profile.dev.package.ps-media]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Release packages (ADR-0030): stripped, no debug info.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
