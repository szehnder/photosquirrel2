# Performance budgets (ADR-0026). Absolute values apply on the reference machine (16-core x86-64, NVMe, 30 GB);
# CI checks relative regressions (>15%) against perf-baseline.json. All budgets are lower-is-better.
# `change` names the OpenSpec change that adds the measurement; `source` says how `cargo xtask bench --check`
# measures it (see xtask/src/bench.rs). Budgets are added by the changes that introduce the measured code.

# content-hashing (ADR-0012, ADR-0026). Criterion benches for exploration: `cargo bench -p ps-hash --bench hashing`.
[[budget]]
name = "phash-dhash-per-image"
metric = "median"
max = 0.3
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_hash_cost_within_budget" }

[[budget]]
name = "near-dup-lookup-p95"
metric = "p95"
max = 1.0
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_lookup_within_budget" }

[[budget]]
name = "near-dup-index-build"
metric = "min"
max = 1000.0
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_index_build_under_one_second" }

# media-analysis (ADR-0010, ADR-0016, ADR-0026, ADR-0036). Derived component budget: 15 worker cores at 150 files/s
# leave 100 ms per 12 MP JPEG for the analysis decode + grid thumbnail on one core.
# Criterion benches for exploration: `cargo bench -p ps-media --bench analyze`.
[[budget]]
name = "analysis-decode-thumb"
metric = "median"
max = 100.0
unit = "ms"
change = "media-analysis"
source = { kind = "test", package = "ps-media", test = "thumbnails", name = "scenario_thumbnails_decode_within_per_file_budget" }

# catalog (ADR-0005, ADR-0018, ADR-0026, ADR-0036). Insert throughput as time per row: 20 us = 50k rows/s, 1M
# walk rows through the batching writer from two producer threads. ID list: median of 5 runs over 1M items.
[[budget]]
name = "catalog-insert"
metric = "mean"
max = 20.0
unit = "us"
change = "catalog"
source = { kind = "test", package = "ps-catalog", test = "budgets", name = "scenario_catalog_insert_50k_rows_per_second" }

[[budget]]
name = "catalog-id-list-1m"
metric = "median"
max = 300.0
unit = "ms"
change = "catalog"
source = { kind = "test", package = "ps-catalog", test = "budgets", name = "scenario_catalog_id_list_for_1m_within_300_ms" }

# app-shell (ADR-0026): the release app with measurement flags (opens a window; skipped by `--ci`).
# Cold start: launch to the first presented frame, median of 10 runs. Idle RSS: resident memory after 5 s idle.
# The shell does not load catalog items yet; the `gallery` change switches idle-rss to its 1M synthetic catalog.
[[budget]]
name = "cold-start"
metric = "median"
max = 400.0
unit = "ms"
change = "app-shell"
source = { kind = "app", args = ["--measure-startup"], runs = 10 }

[[budget]]
name = "idle-rss"
metric = "max"
max = 250.0
unit = "MB"
change = "app-shell"
source = { kind = "app", args = ["--measure-idle-memory", "5"], runs = 1 }

# scanning (ADR-0007, ADR-0008, ADR-0009, ADR-0026, ADR-0036). Analysis throughput as wall time per file: 6.67 ms =
# 150 files/s of warm-cache 12 MP JPEGs on 16 cores (2,000 paths hard-linked to 50 distinct files). No-change
# rescan: median of 3 rescans of an unchanged 100,000-file tree. Control: p95 of 20 cancel/pause requests at
# random moments, request -> every reader and worker idle (pause) or stopped and recorded (cancel).
[[budget]]
name = "scan-analysis-12mp"
metric = "mean"
max = 6.67
unit = "ms"
change = "scanning"
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_scanning_analysis_throughput_within_budget" }

[[budget]]
name = "rescan-nochange-100k"
metric = "median"
max = 4.0
unit = "s"
change = "scanning"
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_incremental_rescan_no_change_rescan_under_4_s" }

[[budget]]
name = "control-latency-p95"
metric = "p95"
max = 250.0
unit = "ms"
change = "scanning"
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_scan_control_control_latency_within_budget" }
