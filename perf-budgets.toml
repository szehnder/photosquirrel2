# Performance budgets (ADR-0026). Absolute values apply on the reference machine (16-core x86-64, NVMe, 30 GB);
# CI checks relative regressions (>15%) against perf-baseline.json. All budgets are lower-is-better.
# `change` names the OpenSpec change that adds the measurement; `source` says how `cargo xtask bench --check`
# measures it (see xtask/src/bench.rs). Budgets are added by the changes that introduce the measured code.
# The eleven ADR-0026 budgets: gallery-scroll-p95, first-gallery-frame, cold-start, idle-rss, catalog-insert,
# catalog-id-list-1m, rescan-nochange-100k, scan-analysis-12mp, phash-dhash-per-image, near-dup-lookup-p95 and
# control-latency-p95. The others (near-dup-index-build, analysis-decode-thumb, dedup-regroup-1k-of-1m,
# export-replan-50k) are component budgets owned by their change and guarded the same way. docs/performance.md
# describes the reference machine and how to measure.

# content-hashing (ADR-0012, ADR-0026). Criterion benches for exploration: `cargo bench -p ps-hash --bench hashing`.
[[budget]]
name = "phash-dhash-per-image"
metric = "median"
max = 0.3
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_hash_cost_within_budget" }

[[budget]]
name = "near-dup-lookup-p95"
metric = "p95"
max = 1.0
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_lookup_within_budget" }

[[budget]]
name = "near-dup-index-build"
metric = "min"
max = 1000.0
unit = "ms"
change = "content-hashing"
source = { kind = "test", package = "ps-hash", test = "budgets", name = "scenario_perceptual_hashing_index_build_under_one_second" }

# media-analysis (ADR-0010, ADR-0016, ADR-0026, ADR-0036). Derived component budget: 15 worker cores at 150 files/s
# leave 100 ms per 12 MP JPEG for the analysis decode + grid thumbnail on one core.
# Criterion benches for exploration: `cargo bench -p ps-media --bench analyze`.
[[budget]]
name = "analysis-decode-thumb"
metric = "median"
max = 100.0
unit = "ms"
change = "media-analysis"
source = { kind = "test", package = "ps-media", test = "thumbnails", name = "scenario_thumbnails_decode_within_per_file_budget" }

# catalog (ADR-0005, ADR-0018, ADR-0026, ADR-0036). Insert throughput as time per row: 20 us = 50k rows/s, 1M
# walk rows through the batching writer from two producer threads. ID list: median of 5 runs over 1M items.
[[budget]]
name = "catalog-insert"
metric = "mean"
max = 20.0
unit = "us"
change = "catalog"
source = { kind = "test", package = "ps-catalog", test = "budgets", name = "scenario_catalog_insert_50k_rows_per_second" }

[[budget]]
name = "catalog-id-list-1m"
metric = "median"
max = 300.0
unit = "ms"
change = "catalog"
source = { kind = "test", package = "ps-catalog", test = "budgets", name = "scenario_catalog_id_list_for_1m_within_300_ms" }

# excluded-view-filters (ADR-0103, ADR-0026). The Excluded view opening on 1M files with 200,000 excluded (180,000 by the
# classifier in five categories, 20,000 by accepted AI suggestions): the chip counts, the default view's ID list and its
# first 200-row page, from one pass over the excluded set. Median of 5 runs. Measured 105 ms.
[[budget]]
name = "excluded-view-open"
metric = "median"
max = 150.0
unit = "ms"
change = "excluded-view-filters"
source = { kind = "test", package = "ps-catalog", test = "budgets", name = "scenario_performance_budgets_excluded_view_open_within_budget" }

# app-shell (ADR-0026): the release app with measurement flags (opens a window; skipped by `--ci`).
# Cold start: launch to the first presented frame, median of 10 runs. Idle RSS: resident memory after 5 s idle
# on the gallery's 1M synthetic catalog (built once, like first-gallery-frame; PHOTOSQUIRREL_SYNTHETIC_DIR moves
# it). Measured 213 MB (113 MB on an empty data dir).
[[budget]]
name = "cold-start"
metric = "median"
max = 400.0
unit = "ms"
change = "app-shell"
source = { kind = "app", args = ["--measure-startup"], runs = 10 }

[[budget]]
name = "idle-rss"
metric = "max"
max = 250.0
unit = "MB"
change = "app-shell"
source = { kind = "app", args = ["--synthetic-catalog", "1000000", "--measure-idle-memory", "5"], runs = 1 }

# scanning (ADR-0007, ADR-0008, ADR-0009, ADR-0026, ADR-0036). Analysis throughput as wall time per file: 6.67 ms =
# 150 files/s of warm-cache 12 MP JPEGs on 16 cores (2,000 paths hard-linked to 50 distinct files). No-change
# rescan: median of 3 rescans of an unchanged 100,000-file tree. Control: p95 of 20 cancel/pause requests at
# random moments, request -> every reader and worker idle (pause) or stopped and recorded (cancel).
[[budget]]
name = "scan-analysis-12mp"
metric = "mean"
max = 6.67
unit = "ms"
change = "scanning"
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_scanning_analysis_throughput_within_budget" }

[[budget]]
name = "rescan-nochange-100k"
metric = "median"
max = 4.0
unit = "s"
change = "scanning"
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_incremental_rescan_no_change_rescan_under_4_s" }

[[budget]]
name = "control-latency-p95"
metric = "p95"
max = 250.0
unit = "ms"
change = "scanning"
# ADR-0078: in CI, base and head are measured 5 times each and their medians compared (best-of-3 flaked on
# identical code); a suspected regression measures the head 5 more times. The absolute bound is unchanged.
ci_runs = 5
source = { kind = "test", package = "ps-scan", test = "budgets", name = "scenario_scan_control_control_latency_within_budget" }

# duplicate-groups (ADR-0013, ADR-0026). The scan's post-stage regroup: 1,000 new files against a grouped catalog of
# 1M inputs with the long-lived engine (MIH index inserts, only affected groups recomputed). Measured 23 ms.
[[budget]]
name = "dedup-regroup-1k-of-1m"
metric = "max"
max = 250.0
unit = "ms"
change = "duplicate-groups"
source = { kind = "test", package = "ps-dedup", test = "scale", name = "regroup_1k_of_1m_within_budget" }

# gallery (ADR-0018, ADR-0026). Render benchmark: the release app flings a synthetic 1,000,000-item list with
# warm textures (3,000 distinct thumbnails decoded and uploaded first) and prints `frame interval ms: p50=..
# p95=..`; the window must be visible and focused (Wayland sends no frames otherwise). First gallery frame:
# launch to the first frame with gallery cells on a synthetic 1M catalog (built once into the temp folder).
# `cargo test --release -p ui-gallery --test render_cost -- --ignored` measures the headless CPU cost of the same frames.
[[budget]]
name = "gallery-scroll-p95"
metric = "p95"
max = 8.3
unit = "ms"
change = "gallery"
source = { kind = "app", args = ["--render-bench", "10"], runs = 1, render_p95 = true }

[[budget]]
name = "first-gallery-frame"
metric = "median"
max = 600.0
unit = "ms"
change = "gallery"
source = { kind = "app", args = ["--synthetic-catalog", "1000000", "--measure-first-gallery-frame"], runs = 5 }

# export (ADR-0044, budget amended by ADR-0050; ADR-0026). Re-plan of a library that already holds every keeper: 50,000 exported files in the
# ledger with their size and modification time, each with its sidecar; the planner stats each copy and sidecar and reads none (the Export view
# re-plans on open and on every profile change). Median of 3 plans, sidecars recorded too. Measured 398-430 ms (release, NVMe).
[[budget]]
name = "export-replan-50k"
metric = "median"
max = 800.0
unit = "ms"
change = "export"
source = { kind = "test", package = "ps-export", test = "budgets", name = "replan_50k_exported_within_budget" }

# tiff-support (ADR-0085, ADR-0086, ADR-0087). Component budgets: the analysis decode + grid thumbnail of a 12 MP
# (4000x3000) 16-bit RGB LZW TIFF with horizontal predictor and its directories after the data, from memory, on one
# core; and the working memory (largest strip plus downsampling accumulator, the decoder's own accounting) of a
# 24 MP (6000x4000) 16-bit greyscale TIFF with 16-row strips decoded through a reader, as a TIFF above 64 MB is.
[[budget]]
name = "tiff-analysis-decode"
metric = "median"
max = 1000.0
unit = "ms"
change = "tiff-support"
source = { kind = "test", package = "ps-media", test = "tiff", name = "scenario_performance_budgets_tiff_analysis_decode_within_budget" }

[[budget]]
name = "tiff-stream-memory"
metric = "max"
max = 4.0
unit = "MB"
change = "tiff-support"
source = { kind = "test", package = "ps-media", test = "tiff", name = "scenario_performance_budgets_streamed_tiff_decode_memory_within_budget" }
