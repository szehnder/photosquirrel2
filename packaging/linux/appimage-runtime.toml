# The AppImage type2 runtime every PhotoSquirrel AppImage starts with, and what it contains (ADR-0073).
#
# `cargo xtask package` downloads `runtime.url`, checks `runtime.sha256` and hands the file to appimagetool
# (LDAI_RUNTIME_FILE); it pre-places `apprun.url` as cargo-packager's AppRun. After packaging it reads the runtime
# back out of the AppImage, zeroes the sections appimagetool fills in (.digest_md5, .upd_info, .sha256_sig,
# .sig_key), and fails unless that hash equals `runtime.sha256` and the components the runtime's help text names
# equal the `[[component]]` names below. THIRD-PARTY-LICENSES gets an "AppImage runtime" section rendered from this
# file, and the release job attaches every `[[source]]` archive, checked against its sha256.
#
# To move to another runtime build: pick a tagged release of https://github.com/AppImage/type2-runtime, update
# `[runtime]`, read the versions it was built with (scripts/common/install-dependencies.sh and the Alpine release in
# scripts/chroot/chroot_build.sh at its commit; `strings runtime-x86_64` shows libfuse, squashfuse, zstd and zlib),
# then the components, the licence texts under appimage-runtime/ and the libfuse `[[source]]` entries.

[runtime]
# type2-runtime release 20251108 (tag at commit dd6cebe, which the runtime's --appimage-version prints).
release = "20251108"
commit = "dd6cebedcbddde9c82f89b011e8e1d40b6e43868"
url = "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
sha256 = "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
size = 944632

# One entry per line of the runtime's "licensed under the terms of" list, in its order; `name` is that line's name.
[[component]]
name = "runtime"
title = "AppImage type2-runtime"
version = "dd6cebe"
licence = "MIT"
text = "type2-runtime.txt"
upstream = "https://github.com/AppImage/type2-runtime"

[[component]]
name = "musl libc"
title = "musl libc"
# Alpine Linux 3.21, the build image of scripts/chroot/chroot_build.sh.
version = "1.2.5"
licence = "MIT"
text = "musl.txt"
upstream = "https://musl.libc.org"

[[component]]
name = "libfuse"
title = "libfuse"
version = "3.15.0"
licence = "LGPL-2.1"
text = "libfuse.txt"
upstream = "https://github.com/libfuse/libfuse"

[[component]]
name = "squashfuse"
title = "squashfuse"
version = "0.5.2"
licence = "BSD-2-Clause"
text = "squashfuse.txt"
upstream = "https://github.com/vasi/squashfuse"

[[component]]
name = "libzstd"
title = "Zstandard (libzstd)"
version = "1.5.6"
licence = "BSD-3-Clause"
text = "zstd.txt"
upstream = "https://github.com/facebook/zstd"

[[component]]
name = "zlib"
title = "zlib"
version = "1.3.1"
licence = "Zlib"
text = "zlib.txt"
upstream = "https://zlib.net"

# The AppImage's AppRun launcher (AppImageKit), which cargo-packager copies into the image.
[apprun]
title = "AppImageKit AppRun"
url = "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64"
sha256 = "f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f"
licence = "MIT"
text = "apprun.txt"
upstream = "https://github.com/AppImage/AppImageKit"

# Sources the release attaches (`cargo xtask runtime-sources`, ADR-0077). For the LGPL component (libfuse,
# LGPL-2.1): the upstream release the runtime was built from and the patch type2-runtime applies to it. For
# relinking the runtime against a modified libfuse: the source of the program that links it (type2-runtime) and of
# squashfuse, linked with it. Each is byte-stable: an upstream release file (`url`), or, for type2-runtime, which
# publishes no source archive, a `git archive --format=tar` of the pinned commit, made by xtask after checking the
# commit's tree hash (`git`, `commit`, `tree`).
[[source]]
name = "libfuse"
version = "3.15.0"
file = "fuse-3.15.0.tar.xz"
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.15.0/fuse-3.15.0.tar.xz"
sha256 = "70589cfd5e1cff7ccd6ac91c86c01be340b227285c5e200baa284e401eea2ca0"

[[source]]
name = "libfuse"
version = "3.15.0"
file = "libfuse-3.15.0-type2-runtime-mount.c.diff"
url = "https://raw.githubusercontent.com/AppImage/type2-runtime/dd6cebedcbddde9c82f89b011e8e1d40b6e43868/patches/libfuse/mount.c.diff"
sha256 = "1c7fd9e26717545a476b226b083a9f9d05676c180edbd71a04bbd8a73599dc44"

[[source]]
name = "runtime"
version = "dd6cebe"
file = "type2-runtime-dd6cebe.tar"
git = "https://github.com/AppImage/type2-runtime"
commit = "dd6cebedcbddde9c82f89b011e8e1d40b6e43868"
tree = "c7cdda89406bda7e04456dd5df8801e42d811ccb"
sha256 = "aeb37c5f3c9f8b4a6b1c455f9e80ab1d63f6a3842b8947b4a36d0740522e53b3"

# squashfuse's release file for the 0.5.2 tag (`make dist`). type2-runtime builds from GitHub's generated archive of
# that tag, which holds the same sources without the generated build files, but whose bytes GitHub does not promise.
[[source]]
name = "squashfuse"
version = "0.5.2"
file = "squashfuse-0.5.2.tar.gz"
url = "https://github.com/vasi/squashfuse/releases/download/0.5.2/squashfuse-0.5.2.tar.gz"
sha256 = "54e4baaa20796e86a214a1f62bab07c7c361fb7a598375576d585712691178f5"
