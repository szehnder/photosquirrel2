[alias]
xtask = "run --quiet --package xtask --"

# ADR-0031: target x86-64-v2 (SSE4.2/POPCNT, every x86-64 CPU since ~2009) so float rounding and
# similar operations compile to single instructions instead of libm calls.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# ADR-0060: link the C runtime statically, so the programs do not need the Visual C++ Redistributable
# (VCRUNTIME140.dll), which Windows does not include and the packages do not carry. `cargo xtask package` checks
# the imports of the shipped .exe files. (A RUSTFLAGS environment variable would replace these flags.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=+crt-static"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# Temp data: `cargo xtask ci|bench` create `<target dir>/tmp` and point TMPDIR/TMP/TEMP at it for the cargo they
# run (AGENTS.md "Machine resources"). There is deliberately no [env] TMPDIR here: a workspace-relative value breaks
# every `tempfile::tempdir()` when `./target` does not exist (a clean checkout built with CARGO_TARGET_DIR set
# elsewhere). Shared test fixtures live under CARGO_TARGET_TMPDIR instead.
