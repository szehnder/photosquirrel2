[alias]
xtask = "run --quiet --package xtask --"

# ADR-0031: target x86-64-v2 (SSE4.2/POPCNT, every x86-64 CPU since ~2009) so float rounding and
# similar operations compile to single instructions instead of libm calls.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# Tests, benches and `cargo run` put temp data on disk under target/ instead of /tmp, which is a small RAM-backed
# tmpfs on the reference machine (AGENTS.md "Machine resources"). Leaked test corpora then cost disk, not memory,
# and `cargo clean` removes them.
[env]
TMPDIR = { value = "target", relative = true, force = true }
TMP = { value = "target", relative = true, force = true }
TEMP = { value = "target", relative = true, force = true }
